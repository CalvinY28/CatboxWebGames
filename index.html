<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A home for small, homemade browser games."
    />
    <title>Catbox Games</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="yarn-toy.css?v=3" />
  </head>
  <body>
    <div class="yarn-toy" id="yarn-toy">
      <svg class="yarn-string" id="yarn-string" aria-hidden="true">
        <path class="yarn-string-shadow" id="yarn-string-shadow"></path>
        <path id="yarn-string-path"></path>
        <g
          class="yarn-string-segments"
          id="yarn-string-segments"
          data-segment-src="assets/yarn-rope-placeholder.svg?v=1"
        ></g>
      </svg>
      <button
        class="yarn-ball"
        id="yarn-ball"
        type="button"
        aria-describedby="yarn-instructions"
        aria-label="Interactive hanging yarn ball"
      >
        <img src="assets/yarnball.png?v=1" alt="" draggable="false" />
      </button>
      <p class="yarn-instructions" id="yarn-instructions">
        Drag and release the yarn ball to swing it. Arrow keys can also nudge it.
      </p>
    </div>

    <div class="site-shell">
      <main>
        <header class="intro">
          <p class="site-label">catvan studio</p>
          <h1>Catbox Games</h1>
          <p class="intro-description">
            My Collection of Homemade Games - Free to Play Online or Local!
          </p>
        </header>

        <section class="game-grid" aria-label="Games and future game slots">
          <a class="game-slot game-slot-coral game-slot-live" href="games/tic-tac-toe/" aria-label="Play Tic-Tac-Toe"></a>
          <div class="game-slot game-slot-yellow" aria-hidden="true"></div>
          <div class="game-slot game-slot-blue" aria-hidden="true"></div>
          <div class="game-slot game-slot-green" aria-hidden="true"></div>
          <div class="game-slot game-slot-pink" aria-hidden="true"></div>
          <div class="game-slot game-slot-purple" aria-hidden="true"></div>
        </section>

        <section class="closing-note" aria-label="About this website">
          <p>
            Hi! I'm Catvan. Enjoy your stay!
          </p>
        </section>
      </main>

      <footer class="site-footer">
        <nav aria-label="Footer navigation">
          <a href="privacy/">Privacy policy</a>
          <a href="mailto:mail@catbox.party">Contact</a>
          <a href="tip/">☕ Tip</a>
        </nav>
        <p>© 2027 Catvan Studio. All rights reserved.</p>
      </footer>
    </div>

    <script src="yarn-toy.js?v=14"></script>
  </body>
</html>
