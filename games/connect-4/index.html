<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Play local or online two-player Connect 4 on Catbox Games." />
    <title>Connect 4 | Catbox Games</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="game.css?v=6" />
  </head>
  <body>
    <div class="c4-confetti" id="confetti" aria-hidden="true"></div>

    <div class="site-shell">
      <main class="c4-page">
        <a class="back-link" href="../../">Back to games</a>

        <header class="c4-header">
          <p class="site-label">Two-player game</p>
          <h1>Connect 4</h1>
          <p>Take turns dropping discs. Connect four in any direction to win.</p>
        </header>

        <section class="c4-game" aria-labelledby="game-status">
          <div class="c4-mode-picker" role="group" aria-label="Choose how to play">
            <button class="c4-mode-button is-active" id="local-mode" type="button" aria-pressed="true">Local</button>
            <button class="c4-mode-button" id="online-mode" type="button" aria-pressed="false">Play Online</button>
          </div>

          <div class="c4-online-panel" id="online-panel" hidden>
            <p id="connection-status" class="c4-connection-status" role="status" aria-live="polite"></p>
            <label class="c4-invite-label" for="invite-link">Invite link</label>
            <div class="c4-invite-row">
              <input id="invite-link" type="text" readonly />
              <button id="copy-invite" type="button">Copy</button>
            </div>
            <button class="c4-new-room" id="new-room" type="button">Create a new link</button>
            <p class="c4-online-note">Anyone with this link can join your room.</p>
          </div>

          <p id="game-status" class="c4-status" role="status" aria-live="polite">
            Red's turn
          </p>

          <div class="c4-board" id="game-board" role="grid" aria-label="Connect 4 board">
            <button class="c4-column" type="button" data-column="0" aria-label="Drop a disc in column 1"></button>
            <button class="c4-column" type="button" data-column="1" aria-label="Drop a disc in column 2"></button>
            <button class="c4-column" type="button" data-column="2" aria-label="Drop a disc in column 3"></button>
            <button class="c4-column" type="button" data-column="3" aria-label="Drop a disc in column 4"></button>
            <button class="c4-column" type="button" data-column="4" aria-label="Drop a disc in column 5"></button>
            <button class="c4-column" type="button" data-column="5" aria-label="Drop a disc in column 6"></button>
            <button class="c4-column" type="button" data-column="6" aria-label="Drop a disc in column 7"></button>
          </div>

          <section
            class="c4-rematch"
            id="rematch-panel"
            aria-label="Rematch options"
            aria-live="polite"
            hidden
          >
            <button class="c4-rematch-button" id="rematch-button" type="button">
              Rematch
            </button>
          </section>
        </section>
      </main>

      <footer class="site-footer">
        <nav aria-label="Footer navigation">
          <a href="/privacy/">Privacy policy</a>
          <a href="/about/">About</a>
          <a href="/tip/">☕Tip</a>
        </nav>
        <p>© 2027 Catvan Studio. All rights reserved.</p>
      </footer>
    </div>

    <script src="game.js?v=3"></script>
  </body>
</html>
