<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Play local or online two-player Tic-Tac-Toe on Catbox Games." />
    <title>Tic-Tac-Toe | Catbox Games</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="game.css?v=5" />
  </head>
  <body>
    <div class="ttt-confetti" id="confetti" aria-hidden="true"></div>
    <div class="site-shell">
      <main class="ttt-page">
        <a class="back-link" href="../../">Back to games</a>

        <header class="ttt-header">
          <p class="site-label">Two-player game</p>
          <h1>Tic - Tac - Toe</h1>
          <p>Take turns placing X and O's. Get three in a row to win.</p>
        </header>

        <section class="ttt-game" aria-labelledby="game-status">
          <div class="ttt-mode-picker" role="group" aria-label="Choose how to play">
            <button class="ttt-mode-button is-active" id="local-mode" type="button" aria-pressed="true">Local</button>
            <button class="ttt-mode-button" id="online-mode" type="button" aria-pressed="false">Play Online</button>
          </div>

          <div class="ttt-online-panel" id="online-panel" hidden>
            <p id="connection-status" class="ttt-connection-status" role="status" aria-live="polite"></p>
            <label class="ttt-invite-label" for="invite-link">Invite link</label>
            <div class="ttt-invite-row">
              <input id="invite-link" type="text" readonly />
              <button id="copy-invite" type="button">Copy</button>
            </div>
            <button class="ttt-new-room" id="new-room" type="button">Create a new link</button>
            <p class="ttt-online-note">Anyone with this link can join your room.</p>
          </div>

          <p id="game-status" class="ttt-status" role="status" aria-live="polite">X's turn</p>

          <div class="ttt-board" role="grid" aria-label="Tic-Tac-Toe board">
            <button class="ttt-cell" type="button" data-cell="0" data-label="Top left" aria-label="Top left, empty"></button>
            <button class="ttt-cell" type="button" data-cell="1" data-label="Top middle" aria-label="Top middle, empty"></button>
            <button class="ttt-cell" type="button" data-cell="2" data-label="Top right" aria-label="Top right, empty"></button>
            <button class="ttt-cell" type="button" data-cell="3" data-label="Middle left" aria-label="Middle left, empty"></button>
            <button class="ttt-cell" type="button" data-cell="4" data-label="Center" aria-label="Center, empty"></button>
            <button class="ttt-cell" type="button" data-cell="5" data-label="Middle right" aria-label="Middle right, empty"></button>
            <button class="ttt-cell" type="button" data-cell="6" data-label="Bottom left" aria-label="Bottom left, empty"></button>
            <button class="ttt-cell" type="button" data-cell="7" data-label="Bottom middle" aria-label="Bottom middle, empty"></button>
            <button class="ttt-cell" type="button" data-cell="8" data-label="Bottom right" aria-label="Bottom right, empty"></button>
          </div>

          <section
            class="ttt-rematch"
            id="rematch-panel"
            aria-label="Rematch options"
            aria-live="polite"
            hidden
          >
            <button class="ttt-rematch-button" id="rematch-button" type="button">
              Rematch
            </button>
          </section>
        </section>
      </main>

      <footer class="site-footer">
        <nav aria-label="Footer navigation">
          <a href="/privacy/">Privacy policy</a>
          <a href="/about/">About</a>
          <a href="/tip/">☕Tip</a>
        </nav>
        <p>© 2027 Catvan Studio. All rights reserved.</p>
      </footer>
    </div>

    <script src="game.js?v=10"></script>
  </body>
</html>
